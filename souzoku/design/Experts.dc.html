<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>相談先をえらぶ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans",sans-serif;color:#18202C;background:#F4F6F9}
a{color:#27497A}a:hover{color:#1C3659}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; background: #F4F6F9; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex-grow: 1; padding: 28px 20px 16px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 13px; color: #27497A; font-weight: 700; letter-spacing: 0.06em">1 / 3　相談先をえらぶ</div>
      <h1 style="margin: 0; font-family: 'Shippori Mincho B1', 'Hiragino Mincho ProN', serif; font-size: 25px; letter-spacing: 0.04em">相続の専門家にそうだん</h1>
      <p style="margin: 0; font-size: 14px; line-height: 1.75; color: #4F5A6B">相続にくわしい3つの専門家に、メールで相談できます。いくつでも選べます。<b style="color: #18202C">電話はかかってきません。</b></p>
    </div>

    <label for="ex-takken" style="display: flex; gap: 12px; align-items: flex-start; background: #FFFFFF; border: 2px solid {{accent}}; border-radius: 16px; padding: 14px 16px; cursor: pointer">
      <input id="ex-takken" type="checkbox" checked="checked" style="width: 22px; height: 22px; margin: 2px 0 0; accent-color: #27497A; flex-shrink: 0">
      <span style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 17px; font-weight: 700">宅建士<span style="font-size: 13px; font-weight: 500; color: #5F6979; margin-left: 6px">不動産会社</span></span>
        <span style="font-size: 14px; line-height: 1.6">家を売るか迷っている／いくらで売れるか／売り方</span>
        <span style="font-size: 12px; color: #5F6979">[提携宅建業者名]・宅建業免許 [免許番号]</span>
        <span style="font-size: 12px; line-height: 1.6; color: #4F5A6B; background: #EEF2F7; border-radius: 8px; padding: 6px 8px">売買が成約したとき、運営者はこの会社から紹介料を受け取ります。あなたの支払いは増えません。</span>
      </span>
    </label>

    <label for="ex-bengo" style="display: flex; gap: 12px; align-items: flex-start; background: #FFFFFF; border: 1px solid #DBE1EA; border-radius: 16px; padding: 15px 17px; cursor: pointer">
      <input id="ex-bengo" type="checkbox" style="width: 22px; height: 22px; margin: 2px 0 0; accent-color: #27497A; flex-shrink: 0">
      <span style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 17px; font-weight: 700">弁護士</span>
        <span style="font-size: 14px; line-height: 1.6">相続人どうしの話し合い／相続放棄／遺言・共有のもめごと</span>
        <span style="font-size: 12px; color: #5F6979">[提携法律事務所名]</span>
        <span style="font-size: 12px; color: #2D7152; font-weight: 700">紹介料は受け取りません</span>
      </span>
    </label>

    <label for="ex-zeiri" style="display: flex; gap: 12px; align-items: flex-start; background: #FFFFFF; border: 2px solid {{accent}}; border-radius: 16px; padding: 14px 16px; cursor: pointer">
      <input id="ex-zeiri" type="checkbox" checked="checked" style="width: 22px; height: 22px; margin: 2px 0 0; accent-color: #27497A; flex-shrink: 0">
      <span style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 17px; font-weight: 700">税理士</span>
        <span style="font-size: 14px; line-height: 1.6">相続税／売ったときの税金／空き家特例が使えるか</span>
        <span style="font-size: 12px; color: #5F6979">[提携税理士事務所名]</span>
        <span style="font-size: 12px; color: #2D7152; font-weight: 700">紹介料は受け取りません</span>
      </span>
    </label>

    <p style="margin: 0; font-size: 12.5px; line-height: 1.7; color: #4F5A6B">運営者は専門家をご紹介するだけです。売買の仲介や、交渉・手続きの代行はしません。</p>

    <a href="Form.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 14px; background: #27497A; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none">次へ（2件を選択中）</a>
  </div>

  <nav aria-label="メインメニュー" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #DBE1EA; padding: 6px 8px 26px">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 50px; font-size: 11px; color: #5F6979; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg>ホーム</a>
    <a href="Learn.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 50px; font-size: 11px; color: #5F6979; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"></path><path d="M4 19V5"></path></svg>まなぶ</a>
    <a href="Sim.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 50px; font-size: 11px; color: #5F6979; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M8 7h8M8 12h2M12 12h2M8 16h2M12 16h2M16 12v4"></path></svg>はかる</a>
    <a href="Experts.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 50px; font-size: 11px; font-weight: 700; color: #27497A; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H8l-4 4z"></path></svg>そうだん</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#27497A","options":["#27497A","#2D5E57","#4A3F6B"]},"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#27497A' };
  }
}
</script>
</body>
</html>
