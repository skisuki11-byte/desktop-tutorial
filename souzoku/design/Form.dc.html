<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>相談内容の入力</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans",sans-serif;color:#22213F;background:#F6F4FF}
a{color:#5B4FE0}a:hover{color:#3F34B8}
</style>
</helmet>
<div style="width: 390px; height: 1260px; box-sizing: border-box; background: #F6F4FF; padding: 20px 20px 32px; display: flex; flex-direction: column; gap: 18px; overflow: hidden">
  <a href="Consult.dc.html" style="align-self: flex-start; min-height: 40px; display: flex; align-items: center; font-size: 14px; font-weight: 700; text-decoration: none">‹ 総合窓口</a>
  <div style="display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 13px; font-weight: 700; color: #5B4FE0">1 / 2　入力</span>
    <h1 style="margin: 0; font-family: 'Zen Maru Gothic', sans-serif; font-size: 26px; font-weight: 900">なにを聞きたい？</h1>
  </div>

  <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
    <legend style="font-size: 14px; font-weight: 700; padding: 0; margin-bottom: 10px">あてはまるものを選ぶ <span style="font-size: 11px; font-weight: 700; color: #B8391F; background: #FFE6E0; border-radius: 6px; padding: 1px 6px; margin-left: 4px">必須</span></legend>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <button type="button" aria-pressed="true" style="display: flex; align-items: center; gap: 6px; min-height: 42px; border-radius: 999px; border: 2px solid #5B4FE0; background: #ECE9FF; color: #3F34B8; font: inherit; font-size: 14px; font-weight: 700; padding: 0 14px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #FFC940; border: 1.5px solid #22213F"></span>売るか迷っている</button>
      <button type="button" style="display: flex; align-items: center; gap: 6px; min-height: 42px; border-radius: 999px; border: 2px solid #E4E0F7; background: #FFFFFF; color: #55557A; font: inherit; font-size: 14px; font-weight: 700; padding: 0 14px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #FFC940; border: 1.5px solid #22213F"></span>いくらで売れる？</button>
      <button type="button" aria-pressed="true" style="display: flex; align-items: center; gap: 6px; min-height: 42px; border-radius: 999px; border: 2px solid #5B4FE0; background: #ECE9FF; color: #3F34B8; font: inherit; font-size: 14px; font-weight: 700; padding: 0 14px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #34C08A; border: 1.5px solid #22213F"></span>空き家特例を使える？</button>
      <button type="button" style="display: flex; align-items: center; gap: 6px; min-height: 42px; border-radius: 999px; border: 2px solid #E4E0F7; background: #FFFFFF; color: #55557A; font: inherit; font-size: 14px; font-weight: 700; padding: 0 14px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #34C08A; border: 1.5px solid #22213F"></span>相続税が心配</button>
      <button type="button" style="display: flex; align-items: center; gap: 6px; min-height: 42px; border-radius: 999px; border: 2px solid #E4E0F7; background: #FFFFFF; color: #55557A; font: inherit; font-size: 14px; font-weight: 700; padding: 0 14px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #4AA8FF; border: 1.5px solid #22213F"></span>家族で話がまとまらない</button>
      <button type="button" style="display: flex; align-items: center; gap: 6px; min-height: 42px; border-radius: 999px; border: 2px solid #E4E0F7; background: #FFFFFF; color: #55557A; font: inherit; font-size: 14px; font-weight: 700; padding: 0 14px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #4AA8FF; border: 1.5px solid #22213F"></span>相続放棄を考えている</button>
      <button type="button" style="display: flex; align-items: center; gap: 6px; min-height: 42px; border-radius: 999px; border: 2px solid #E4E0F7; background: #FFFFFF; color: #55557A; font: inherit; font-size: 14px; font-weight: 700; padding: 0 14px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #B9B6D3; border: 1.5px solid #22213F"></span>まだよくわからない</button>
    </div>
    <div style="display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: #55557A">
      <span style="display: flex; align-items: center; gap: 4px"><span style="width: 9px; height: 9px; border-radius: 50%; background: #FFC940"></span>おもに不動産</span>
      <span style="display: flex; align-items: center; gap: 4px"><span style="width: 9px; height: 9px; border-radius: 50%; background: #4AA8FF"></span>おもに弁護士</span>
      <span style="display: flex; align-items: center; gap: 4px"><span style="width: 9px; height: 9px; border-radius: 50%; background: #34C08A"></span>おもに税理士</span>
    </div>
  </fieldset>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <label for="f-body" style="font-size: 14px; font-weight: 700">くわしく <span style="font-size: 11px; font-weight: 500; color: #55557A; background: #F0EEFA; border-radius: 6px; padding: 1px 6px; margin-left: 4px">任意</span></label>
    <textarea id="f-body" rows="4" style="box-sizing: border-box; border: 2px solid #E4E0F7; border-radius: 18px; padding: 12px 14px; font: inherit; font-size: 16px; line-height: 1.7; background: #FFFFFF; color: #22213F; resize: none">母が住んでいた実家です。弟と2人で相続しました。売った場合に空き家特例を使えるか知りたいです。</textarea>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <label for="f-mail" style="font-size: 14px; font-weight: 700">返事を受け取るメール <span style="font-size: 11px; font-weight: 700; color: #B8391F; background: #FFE6E0; border-radius: 6px; padding: 1px 6px; margin-left: 4px">必須</span></label>
    <input id="f-mail" type="email" value="sato.example@mail.jp" style="min-height: 52px; box-sizing: border-box; border: 2px solid #E4E0F7; border-radius: 18px; padding: 0 14px; font: inherit; font-size: 16px; background: #FFFFFF; color: #22213F">
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="f-name" style="font-size: 14px; font-weight: 700">お名前 <span style="font-size: 11px; font-weight: 500; color: #55557A">任意</span></label>
      <input id="f-name" type="text" value="さとう" style="min-height: 52px; box-sizing: border-box; border: 2px solid #E4E0F7; border-radius: 18px; padding: 0 14px; font: inherit; font-size: 16px; background: #FFFFFF; color: #22213F; width: 100%">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="f-area" style="font-size: 14px; font-weight: 700">物件の場所 <span style="font-size: 11px; font-weight: 500; color: #55557A">任意</span></label>
      <input id="f-area" type="text" value="静岡市葵区" style="min-height: 52px; box-sizing: border-box; border: 2px solid #E4E0F7; border-radius: 18px; padding: 0 14px; font: inherit; font-size: 16px; background: #FFFFFF; color: #22213F; width: 100%">
    </div>
  </div>

  <label for="f-attach" style="display: flex; gap: 12px; align-items: center; background: #FFF4CF; border-radius: 20px; padding: 14px 16px; cursor: pointer">
    <input id="f-attach" type="checkbox" checked="checked" style="width: 22px; height: 22px; margin: 0; accent-color: #5B4FE0; flex-shrink: 0">
    <span style="display: flex; flex-direction: column"><b style="font-size: 14px">試算結果を添える</b><span style="font-size: 12.5px; color: #55557A">静岡の実家・手取り 1,897万円</span></span>
  </label>

  <div style="flex-grow: 1"></div>
  <a href="Confirm.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; background: #5B4FE0; color: #FFFFFF; border-radius: 999px; font-family: 'Zen Maru Gothic', sans-serif; font-size: 17px; font-weight: 900; text-decoration: none; box-shadow: 0 4px 0 #3F34B8">入力内容を確認する</a>
  <span style="font-size: 12px; color: #6B6B8C; text-align: center">まだ送信されません</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1260}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
