<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>相談内容の入力</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans",sans-serif;color:#18202C;background:#F4F6F9}
a{color:#27497A}a:hover{color:#1C3659}
</style>
</helmet>
<div style="width: 390px; height: 980px; box-sizing: border-box; background: #F4F6F9; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex-grow: 1; padding: 28px 20px 24px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <a href="Experts.dc.html" style="font-size: 14px; text-decoration: none; min-height: 32px; display: flex; align-items: center">‹ 相談先にもどる</a>
      <div style="font-size: 13px; color: #27497A; font-weight: 700; letter-spacing: 0.06em">2 / 3　相談内容の入力</div>
      <h1 style="margin: 0; font-family: 'Shippori Mincho B1', 'Hiragino Mincho ProN', serif; font-size: 25px; letter-spacing: 0.04em">ご相談の内容</h1>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center">
      <span style="font-size: 13px; color: #5F6979">相談先</span>
      <span style="font-size: 13px; font-weight: 700; color: #27497A; background: #E3EAF4; border-radius: 999px; padding: 3px 12px">宅建士</span>
      <span style="font-size: 13px; font-weight: 700; color: #27497A; background: #E3EAF4; border-radius: 999px; padding: 3px 12px">税理士</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="f-name" style="font-size: 14px; font-weight: 700; display: flex; gap: 8px; align-items: center">お名前 <span style="font-size: 11px; font-weight: 500; color: #4F5A6B; border: 1px solid #C9D1DC; border-radius: 5px; padding: 0 6px">任意・ニックネーム可</span></label>
      <input id="f-name" type="text" value="さとう" style="min-height: 48px; box-sizing: border-box; border: 1px solid #C9D1DC; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 16px; background: #FFFFFF; color: #18202C">
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="f-mail" style="font-size: 14px; font-weight: 700; display: flex; gap: 8px; align-items: center">メールアドレス <span style="font-size: 11px; font-weight: 700; color: #9A3A22; border: 1px solid #E3B6A6; border-radius: 5px; padding: 0 6px">必須</span></label>
      <input id="f-mail" type="email" value="sato.example@mail.jp" style="min-height: 48px; box-sizing: border-box; border: 1px solid #C9D1DC; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 16px; background: #FFFFFF; color: #18202C">
      <span style="font-size: 12px; color: #5F6979">専門家からの返信はこのアドレスに届きます</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="f-area" style="font-size: 14px; font-weight: 700; display: flex; gap: 8px; align-items: center">物件の場所 <span style="font-size: 11px; font-weight: 500; color: #4F5A6B; border: 1px solid #C9D1DC; border-radius: 5px; padding: 0 6px">任意・市区町村まで</span></label>
      <input id="f-area" type="text" value="静岡県 静岡市葵区" style="min-height: 48px; box-sizing: border-box; border: 1px solid #C9D1DC; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 16px; background: #FFFFFF; color: #18202C">
    </div>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 14px; font-weight: 700; padding: 0; margin-bottom: 8px">相談したいこと <span style="font-size: 11px; font-weight: 700; color: #9A3A22; border: 1px solid #E3B6A6; border-radius: 5px; padding: 0 6px; margin-left: 6px">必須</span></legend>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button type="button" aria-pressed="true" style="min-height: 40px; border-radius: 999px; border: 1.5px solid #27497A; background: #E3EAF4; color: #27497A; font: inherit; font-size: 14px; font-weight: 700; padding: 0 14px">売るか迷っている</button>
        <button type="button" aria-pressed="true" style="min-height: 40px; border-radius: 999px; border: 1.5px solid #27497A; background: #E3EAF4; color: #27497A; font: inherit; font-size: 14px; font-weight: 700; padding: 0 14px">特例を使えるか</button>
        <button type="button" aria-pressed="false" style="min-height: 40px; border-radius: 999px; border: 1px solid #C9D1DC; background: #FFFFFF; color: #4F5A6B; font: inherit; font-size: 14px; padding: 0 14px">価格を知りたい</button>
        <button type="button" aria-pressed="false" style="min-height: 40px; border-radius: 999px; border: 1px solid #C9D1DC; background: #FFFFFF; color: #4F5A6B; font: inherit; font-size: 14px; padding: 0 14px">遠方で管理できない</button>
      </div>
      <label for="f-body" style="font-size: 13px; color: #4F5A6B; margin-top: 4px">くわしく（1,000字まで）</label>
      <textarea id="f-body" rows="4" style="box-sizing: border-box; border: 1px solid #C9D1DC; border-radius: 12px; padding: 12px 14px; font: inherit; font-size: 16px; line-height: 1.7; background: #FFFFFF; color: #18202C; resize: none">母が住んでいた実家（築45年・木造）です。弟と2人で相続しました。売った場合に空き家特例を使えるか知りたいです。</textarea>
    </fieldset>

    <label for="f-attach" style="display: flex; gap: 10px; align-items: center; min-height: 44px; font-size: 14px">
      <input id="f-attach" type="checkbox" checked="checked" style="width: 20px; height: 20px; margin: 0; accent-color: #27497A">
      試算結果（手取り 1,897万円）を添える
    </label>

    <a href="Confirm.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 14px; background: #27497A; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none; margin-top: 4px">入力内容を確認する</a>
    <div style="font-size: 12px; color: #5F6979; text-align: center">まだ送信されません。次の画面で内容を確認できます。</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":980}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
