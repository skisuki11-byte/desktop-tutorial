      </div>
      <div style="display: flex; align-items: center; gap: 12px; min-height: 48px; border-bottom: 1px solid #DBE1EA">
        <span style="flex-shrink: 0; font-size: 12px; font-weight: 700; color: #2D7152; background: #E1EFE8; border-radius: 8px; padding: 2px 10px">済</span>

      </div>
      <div style="display: flex; align-items: center; gap: 12px; min-height: 48px; border-bottom: 1px solid #DBE1EA">
        <span style="flex-shrink: 0; font-size: 12px; font-weight: 700; color: #B2462B; background: #F7E6E0; border-radius: 8px; padding: 2px 10px; font-variant-numeric: tabular-nums">あと461日</span>

      </div>
      <div style="display: flex; align-items: center; gap: 12px; min-height: 48px">

    <a href="Learn.dc.html" style="display: flex; flex-direction: column; gap: 2px; background: #FFFFFF; border: 1px solid #DBE1EA; border-radius: 16px; padding: 14px 16px; text-decoration: none; color: #18202C">

</div>
