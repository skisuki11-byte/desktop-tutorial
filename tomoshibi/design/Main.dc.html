<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
  <style>
    body { margin:0; font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif; }
    a { color:#33708F; } a:hover { color:#245A76; }
  </style>
</helmet>

<div style="width:390px;height:844px;background:#FDFAF2;color:#33302A;display:flex;flex-direction:column;overflow:hidden">

  <div style="display:flex;align-items:center;justify-content:space-between;padding:22px 20px 8px">
    <div style="display:flex;align-items:center;gap:8px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="5" fill="#E8A33D"/><g stroke="#E8A33D" stroke-width="2" stroke-linecap="round"><path d="M12 2.5v2"/><path d="M12 19.5v2"/><path d="M2.5 12h2"/><path d="M19.5 12h2"/><path d="M5.2 5.2l1.4 1.4"/><path d="M17.4 17.4l1.4 1.4"/><path d="M18.8 5.2l-1.4 1.4"/><path d="M6.6 17.4l-1.4 1.4"/></g></svg>
      <span style="font-size:14px;color:#857C6E;font-weight:500">9月13日 土曜日</span>
    </div>
    <span style="font-size:13px;color:#9A6A1B;font-weight:700;background:#FBF0DA;padding:5px 12px;border-radius:999px">おはよう</span>
  </div>

  <div style="position:relative;margin:6px 20px 0;background:#FFFFFF;border:2px solid #EDE4D2;border-radius:26px;padding:0 0 20px;overflow:hidden">

    <div style="position:relative;height:210px;background:linear-gradient(180deg,#EAF3F8 0%,#EAF3F8 62%,#EAF5E4 62%,#E4F0DA 100%)">
      <svg width="390" height="210" viewBox="0 0 390 210" style="position:absolute;inset:0" fill="none">
        <ellipse cx="52" cy="42" rx="26" ry="14" fill="#FFFFFF" opacity=".85"/>
        <ellipse cx="74" cy="36" rx="18" ry="12" fill="#FFFFFF" opacity=".85"/>
        <ellipse cx="320" cy="58" rx="22" ry="12" fill="#FFFFFF" opacity=".7"/>
        <path d="M0 132 C60 122 110 140 170 132 C230 124 280 142 390 130 L390 210 L0 210 Z" fill="#CFE6BC"/>
        <g stroke="#8FB878" stroke-width="2.4" stroke-linecap="round">
          <path d="M28 176 C26 166 30 160 34 156"/><path d="M40 180 C40 170 37 164 33 159"/>
          <path d="M352 172 C350 162 354 156 358 152"/><path d="M364 176 C364 166 361 160 357 155"/>
        </g>
        <g><circle cx="60" cy="150" r="5.5" fill="#E8A0A0"/><circle cx="60" cy="150" r="2.2" fill="#FBF0DA"/><path d="M60 156 v12" stroke="#8FB878" stroke-width="2.4" stroke-linecap="round"/></g>
        <g><circle cx="332" cy="146" r="5" fill="#E8A33D"/><circle cx="332" cy="146" r="2" fill="#FFF7E6"/><path d="M332 151 v12" stroke="#8FB878" stroke-width="2.4" stroke-linecap="round"/></g>
      </svg>

      <div style="position:absolute;left:50%;top:26px;transform:translateX(-50%);width:154px;height:154px;border-radius:50%;background:#FBF4E6;border:4px solid #FFFFFF;box-shadow:0 8px 22px rgba(90,74,58,.14);display:grid;place-items:center;overflow:hidden">
        <svg width="132" height="132" viewBox="0 0 120 120" fill="none">
          <path d="M40 110 C33 94 35 72 48 62 C58 54 72 54 82 62 C95 72 97 94 90 110 Z" fill="#E3C49B" stroke="#5A4A3A" stroke-width="2.6" stroke-linejoin="round"/>
          <path d="M88 96 C101 93 106 80 101 70" stroke="#5A4A3A" stroke-width="2.6" stroke-linecap="round"/>
          <path d="M46 32 C36 26 30 36 35 48 C38 55 46 55 49 47 Z" fill="#C9A87E" stroke="#5A4A3A" stroke-width="2.6" stroke-linejoin="round"/>
          <path d="M84 32 C94 26 100 36 95 48 C92 55 84 55 81 47 Z" fill="#C9A87E" stroke="#5A4A3A" stroke-width="2.6" stroke-linejoin="round"/>
          <circle cx="65" cy="46" r="23" fill="#E3C49B" stroke="#5A4A3A" stroke-width="2.6"/>
          <ellipse cx="65" cy="56" rx="12" ry="9" fill="#F2E2CB" stroke="#5A4A3A" stroke-width="2.2"/>
          <ellipse cx="65" cy="51" rx="3.8" ry="2.8" fill="#5A4A3A"/>
          <path d="M65 54 v3" stroke="#5A4A3A" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M61 59 C63 61 67 61 69 59" stroke="#5A4A3A" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="56" cy="41" r="2.8" fill="#5A4A3A"/><circle cx="74" cy="41" r="2.8" fill="#5A4A3A"/>
          <circle cx="57" cy="40" r="1" fill="#FFFFFF"/><circle cx="75" cy="40" r="1" fill="#FFFFFF"/>
          <circle cx="47" cy="52" r="3.4" fill="#EFB3AE" opacity=".6"/><circle cx="83" cy="52" r="3.4" fill="#EFB3AE" opacity=".6"/>
        </svg>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 20px 0">
      <p style="margin:0;font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:27px;letter-spacing:.08em">ももこ</p>
      <p style="margin:0;font-size:12px;color:#857C6E;letter-spacing:.04em;font-variant-numeric:tabular-nums">2011.4.2 — 2026.3.9 ・ いっしょに 5,455日</p>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 20px 0">
    <button style="width:100%;min-height:62px;border:0;border-radius:999px;background:#E8A33D;color:#FFFFFF;font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:19px;letter-spacing:.1em;box-shadow:0 6px 0 #C9862A;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 4 C10.6 8.4 7.6 10.4 7.6 14 a4.4 4.4 0 0 0 8.8 0 C16.4 10.4 13.4 8.4 12 4 Z" fill="#FFF2D6" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"/></svg>
      おまいりする
    </button>
    <p style="margin:0;font-size:13px;color:#857C6E">きょうで <b style="font-family:'Zen Maru Gothic',sans-serif;font-size:19px;color:#9A6A1B;font-variant-numeric:tabular-nums">127</b> 回目</p>
  </div>

  <div style="padding:20px 20px 0">
    <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px">
      <p style="margin:0;font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:15px">うごくももこ</p>
      <span style="font-size:12px;color:#33708F;font-weight:700">ぜんぶ見る</span>
    </div>
    <div style="display:flex;gap:10px">
      <div style="flex:1;position:relative;height:88px;border-radius:16px;background:#DCEAF2;border:2px solid #EDE4D2;overflow:hidden;display:grid;place-items:center">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="11" fill="#FFFFFF" opacity=".92"/><path d="M10 8.2 L16 12 L10 15.8 Z" fill="#33708F"/></svg>
        <span style="position:absolute;left:8px;bottom:6px;font-size:11px;font-weight:700;color:#FFFFFF;text-shadow:0 1px 3px rgba(0,0,0,.45)">走ってるところ</span>
      </div>
      <div style="flex:1;position:relative;height:88px;border-radius:16px;background:#E7EEDC;border:2px solid #EDE4D2;overflow:hidden;display:grid;place-items:center">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="11" fill="#FFFFFF" opacity=".92"/><path d="M10 8.2 L16 12 L10 15.8 Z" fill="#4B8340"/></svg>
        <span style="position:absolute;left:8px;bottom:6px;font-size:11px;font-weight:700;color:#FFFFFF;text-shadow:0 1px 3px rgba(0,0,0,.45)">おやつ待ち</span>
      </div>
    </div>
  </div>

  <div style="flex:1"></div>

  <nav style="display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:2px solid #EDE4D2;background:#FFFFFF;padding:9px 4px 16px">
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;color:#9A6A1B">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6.5 10.5V20h11v-9.5"/></svg>
      <span style="font-size:10px;font-weight:700">おうち</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;color:#A69C8C">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="3.2"/><path d="M12 12.2V20"/><path d="M8.6 6.4 6 4.6M15.4 6.4 18 4.6M8.6 11.6 6 13.4M15.4 11.6 18 13.4"/></svg>
      <span style="font-size:10px;font-weight:500">おまいりの庭</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;color:#A69C8C">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="3"/><path d="M3.5 15.5 8 11l3.8 3.8 3.2-3.2 5.5 5.4"/></svg>
      <span style="font-size:10px;font-weight:500">アルバム</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;color:#A69C8C">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="3"/><path d="M16 11.2 21 8.4v7.2L16 12.8Z"/></svg>
      <span style="font-size:10px;font-weight:500">うごく</span>
    </div>
  </nav>

</div>
</x-dc>
</body>
</html>
